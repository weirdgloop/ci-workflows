name: Install MediaWiki
description: Sets up PHP and installs MediaWiki

inputs:
  # Everything is required here as this action is only used within this repo
  mw-branch:
    required: true
    description: The branch of MediaWiki to clone
  mw-git-origin:
    required: true
    description: The GitHub repository which should be used to clone MediaWiki
  extension-name:
    required: true
    description: The name of the extension to enable
  php-version:
    required: true
    description: The PHP version to install
  php-extensions:
    required: true
    description: The PHP extensions (separated by commas) to install
  extension-composer-install:
    required: true
    description: Whether to install composer dependencies in the directory of the extension
  setup-db:
    required: true
    description: Whether to set up the DB using install.php and update.php

runs:
  using: composite
  steps:
    - name: Install PHP ${{ inputs.php-version }}
      uses: shivammathur/setup-php@master
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.php-extensions }}

    - name: Cache Composer cache
      uses: actions/cache@v6
      with:
        path: ~/.composer/cache
        key: composer-php${{ inputs.php-version }}

    - uses: actions/checkout@v7
      with:
        path: EarlyCopy

    - name: Install MediaWiki
      env:
        MW_BRANCH: ${{ inputs.mw-branch }}
        EXTENSION_NAME: ${{ inputs.extension-name }}
        MW_GIT_ORIGIN: ${{ inputs.mw-git-origin }}
        SETUP_DB: ${{ inputs.setup-db }}
      shell: bash
      run: ${{ github.action_path }}/installWiki.sh

    - uses: actions/checkout@v7
      with:
        path: mediawiki/extensions/${{ inputs.extension-name }}

    - name: Download dependencies
      shell: bash
      if: ${{ hashFiles('EarlyCopy/.github/workflows/dependencies.yml') != '' }}
      run: python3 ${{ github.action_path }}/downloadDependencies.py
      working-directory: mediawiki
      env:
        MW_BRANCH: ${{ inputs.mw-branch }}

    - name: Run update.php
      shell: bash
      run: maintenance/run update --quick
      working-directory: mediawiki
      if: inputs.setup-db == 'true'

    - name: Composer install (${{ inputs.extension-name }})
      if: inputs.extension-composer-install
      shell: bash
      run: composer install --no-ansi --no-interaction --prefer-dist
      working-directory: mediawiki/extensions/${{ inputs.extension-name }}
